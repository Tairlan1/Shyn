# Намеренно узкий набор правил: только то, что ловит реальные ошибки
# (неиспользуемые импорты/переменные, синтаксис, недостижимый код) - без
# насаждения стиля (line-length, порядок импортов и т.п.), чтобы линтер
# был полезным сигналом, а не источником шума при каждом PR.
[lint]
select = ["F", "E9"]

exclude = ["model", "model_multiscale", "model_ai_detector", "data", "data_processed", "data_ai_detector"]
